name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - uses: Swatinem/rust-cache@v2
      - run: mise run check
