[package]
name = "moji"
version = "0.1.0"
edition = "2024"

[dependencies]
argh = "0.1.19"
block2 = { version = "0.6", default-features = false, features = ["std"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSText", "NSTextView", "NSGraphics", "NSEvent"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFString", "CFArray", "CFDictionary", "CFNumber", "CFBase", "CFDate", "CFMachPort"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "libc", "CGEvent", "CGEventSource", "CGEventTypes", "CGError", "CGBase", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSArray", "NSDictionary", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSObjCRuntime", "NSObject", "NSDate", "NSRunLoop"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[test]]
name = "live"
path = "tests/live.rs"
harness = false

[profile.release]
lto = true
strip = true

